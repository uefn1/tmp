name: FileHost Free Downloader -> Release

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'DLするURLをカンマ区切り'
        required: true
        type: string
      tag:
        description: 'Releaseタグ (空なら自動生成)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests beautifulsoup4 lxml
          sudo apt-get update && sudo apt-get install -y aria2

      - name: Generate tag
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "RELEASE_TAG=dl-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ inputs.tag }}" >> $GITHUB_ENV
          fi

      - name: Free download (No API Key)
        env:
          INPUT_URLS: ${{ inputs.urls }}
        run: |
          cat << 'PY' > free_xfs.py
          import re, time, os, sys, pathlib
          import requests
          from bs4 import BeautifulSoup

          def get_xfs_direct_link(page_url: str):
              sess = requests.Session()
              sess.headers.update({
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                  "Referer": page_url
              })
              print(f"\n[+] GET {page_url}")
              r = sess.get(page_url, timeout=30)
              if r.status_code != 200:
                  raise Exception(f"GET失敗 {r.status_code}")

              # CAPTCHA検出 -> 自動突破はしない
              if "recaptcha" in r.text.lower() or "hcaptcha" in r.text.lower() or "g-recaptcha" in r.text.lower():
                  raise Exception("CAPTCHA検出: このURLは無料枠でCAPTCHA必須のためActionsでは自動DL不可")

              soup = BeautifulSoup(r.text, 'lxml')
              # 1枚目のフォーム op=download1
              form1 = soup.find("form", {"name": "F1"}) or soup.find("form", {"method": "POST"})
              if not form1:
                  raise Exception("download1フォームが見つからない")
              
              data1 = {}
              for inp in form1.find_all("input"):
                  if inp.get("name"):
                      data1[inp.get("name")] = inp.get("value") or ""
              
              # XFSは基本 download1
              data1.setdefault("op", "download1")
              data1.setdefault("method_free", "Free Download")
              
              print(f"[*] POST download1")
              r2 = sess.post(page_url, data=data1, timeout=30)
              
              # 待機秒数を取得
              m = re.search(r'<span[^>]*id="countdown_str"[^>]*>.*?(\d+).*?</span>', r2.text, re.S)
              if not m:
                  m = re.search(r'(\d+)\s*seconds?', r2.text, re.I)
              wait_sec = int(m.group(1)) if m else 65
              wait_sec = max(5, min(wait_sec, 180))
              print(f"[*] 無料枠待機 {wait_sec}秒...")
              time.sleep(wait_sec + 5)

              soup2 = BeautifulSoup(r2.text, 'lxml')
              form2 = soup2.find("form", {"name": "F1"})
              if not form2:
                  # 直接リンクがHTMLに出てるパターン
                  m2 = re.search(r'href="(https?://[^"]+/d/[^"]+)"', r2.text)
                  if m2:
                      return m2.group(1)
                  raise Exception("download2フォームが見つからない / 直リンクなし")

              data2 = {}
              for inp in form2.find_all("input"):
                  if inp.get("name"):
                      data2[inp.get("name")] = inp.get("value") or ""
              data2.setdefault("op", "download2")

              print(f"[*] POST download2")
              r3 = sess.post(page_url, data=data2, timeout=60, allow_redirects=True)

              # 最終的な直リンク抽出
              # a) Content-Dispositionならそのままがファイル
              if "Content-Disposition" in r3.headers:
                  return r3.url  # 実際のファイルURLは r3.url ではなく r3自体を保存する必要があるので別処理
              
              m3 = re.search(r'<a[^>]+href="(https?://[^"]+)"[^>]*>.*?(?:Download|ダウンロード|direct)', r3.text, re.I)
              if m3:
                  return m3.group(1)
              m4 = re.search(r'(https?://[^"\' ]+/d/[a-zA-Z0-9]+/[^"\' ]+)', r3.text)
              if m4:
                  return m4.group(1)

              raise Exception("直リンク抽出失敗")

          def download_file(direct_url, out_dir="downloads"):
              pathlib.Path(out_dir).mkdir(exist_ok=True)
              # aria2cで保存
              print(f"[+] Downloading -> {direct_url[:120]}...")
              os.system(f'aria2c -x 4 -s 4 --continue=true -d "{out_dir}" --auto-file-renaming=false "{direct_url}"')

          urls = [u.strip() for u in os.getenv("INPUT_URLS","").split(",") if u.strip()]
          for u in urls:
              try:
                  link = get_xfs_direct_link(u)
                  # Content-Dispositionで直接返ってきた場合はrequestsで保存
                  if link.startswith("http"):
                      # 一部ホストはlinkが最終ファイルURL
                      download_file(link)
                  print(f"[OK] {u}")
              except Exception as e:
                  print(f"[FAIL] {u} : {e}")

          PY
          mkdir -p downloads
          python free_xfs.py
          ls -lh downloads/

      - name: Split >2GB
        run: |
          cd downloads
          for f in *; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ $size -gt 1992294400 ]; then
              echo "Split $f"
              split -b 1900M -d "$f" "${f}.part"
              rm "$f"
            fi
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: downloads/*
          body: |
            Free download (no API key) from:
            ${{ inputs.urls }}
